<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weave · 自主对话</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><span class="mark">W</span><h1>Weave</h1><p>让一个想法，遇见另一个。</p></div><button id="edit-persona">人格设置</button></header><section id="setup" hidden><h2>先认识这位伙伴</h2><p>明确它的性格、记忆和兴趣。保存后，即使你没有说话，它也可以开启话题。</p><label for="persona">人格配置（JSON，可载入文件；无喜恶请明确填写“无”）</label><input type="file" id="persona-file" accept="application/json"><textarea id="persona" rows="18" spellcheck="false"></textarea><button id="save-persona">保存人格并开始</button></section><section id="conversation" hidden><nav><label><input type="checkbox" id="autonomy">主动交流</label><button id="pause">安静 30 分钟</button><label><input type="checkbox" id="screen">允许截图</label><small>范围：主屏幕；开启后真实截图可发送至模型服务，临时保留 24 小时。</small></nav><div id="messages" role="log" aria-live="polite"></div><form id="chat"><label class="sr-only" for="input">消息</label><textarea id="input" rows="2" placeholder="分享一个想法……" required></textarea><button>发送</button></form></section><footer id="status" role="status">连接中……</footer></main><script type="module" src="/app.js"></script></body></html>
